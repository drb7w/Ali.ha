<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACH | 0777F</title>
    <style>
        body { 
            background: #000; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding: 20px; 
            overflow-x: hidden; 
        }
        .video-container { 
            margin: 20px auto; 
            max-width: 400px; 
            border: 2px solid #00ff00; 
            box-shadow: 0 0 20px #00ff00;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
        }
        .btn-hack { 
            background: transparent; 
            color: #ff0000; 
            border: 2px solid #ff0000; 
            padding: 15px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            margin-top: 25px; 
            font-weight: bold; 
            box-shadow: 0 0 10px #ff0000; 
            border-radius: 5px;
            text-transform: uppercase;
        }
        #hacker-screen {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; 
            color: #0f0; 
            padding: 30px 20px; 
            text-align: left; 
            z-index: 9999;
            font-size: 14px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1 style="text-shadow: 0 0 15px #00ff00;">المقر الرئيسي المشفر 💀</h1>

    <div class="video-container">
        <iframe 
            src="https://www.instagram.com/reel/DT5Ht6zjAOY/embed" 
            width="100%" 
            height="480" 
            frameborder="0" 
            scrolling="no" 
            allowtransparency="true">
        </iframe>
    </div>

    <button class="btn-hack" onclick="startHacking()">تفعيل البروتوكول السري ⚡</button>

    <div id="hacker-screen">
        <div id="hack-text"></div>

    <audio id="typeSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3" preload="auto"></audio>
    <audio id="alarmSound" src="https://www.soundjay.com/buttons/beep-01a.mp3" preload="auto"></audio>

    <script>
        // نظام حماية الدخول
        var password = "0777F";
        var input = prompt("النظام مغلق.. أدخل رمز التفعيل الخاص بك:");
        if (input != password) {
            alert("تم رصد محاولة اختراق خارجية! الدخول مرفوض.");
            document.body.innerHTML = "<h1 style='color:red; margin-top:100px;'>ACCESS DENIED<br>IP LOGGED</h1>";
        }

        // دالة المقلب الصوتي والبصري
        function startHacking() {
            var screen = document.getElementById('hacker-screen');
            var textContainer = document.getElementById('hack-text');
            var tSound = document.getElementById('typeSound');
            var aSound = document.getElementById('alarmSound');

            screen.style.display = 'block';

            let lines = [
                "> [!] INITIALIZING SYSTEM EXPLOIT v4.0...",
                "> [!] TARGET IP: 192.168.1.104 [LOCATED]",
                "> [!] BYPASSING LOCAL FIREWALL... [DONE]",
                "> [!] ACCESSING KERNEL MEMORY... [OK]",
                "> [!] SEARCHING FOR SENSITIVE FILES...",
                "> [!] 1,429 PHOTOS DETECTED. UPLOADING...",
                "> [!] EXTRACTING WHATSAPP DATABASE...",
                "> [!] ACCESSING MICROPHONE... [ACTIVE]",
                "> [!] ACTIVATING FRONT CAMERA... [DONE]",
                "> [!] TARGET LOCATED IN: WASIT, IRAQ",
                "> [!] SENDING DATA TO REMOTE SERVER...",
                "> [!] ENCRYPTING ALL PERSONAL FOLDERS...",
                "> [!] SYSTEM OVERHEAT DETECTED! [110°C]",
                "> [!] HARD DRIVE DESTRUCTION: 85%...",
                "> [!] SELF-DESTRUCT INITIATED...",
                "> 5...", "> 4...", "> 3...", "> 2...", "> 1...",
                "> [!!!] SYSTEM FAILURE! DEVICE INFECTED 💀"
            ];
            
            let i = 0;
            function addLine() {
                if (i < lines.length) {
                    textContainer.innerHTML += lines[i] + "\n";
                    
                    // تشغيل الصوت مع كل سطر
                    tSound.currentTime = 0;
                    tSound.play().catch(e => console.log("الصوت يحتاج تفاعل"));
                    
                    i++;
                    setTimeout(addLine, 700); // سرعة الكتابة
                } else {
                    aSound.play();
                    textContainer.innerHTML += "<h1 style='color:red; text-align:center; margin-top:20px;'>CRITICAL ERROR: DATA LEAKED! 💀</h1>";
                }
            }
            addLine();
        }
    </script>

</body>
</html>
