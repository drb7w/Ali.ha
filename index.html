<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقر الرئيسي</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #000814 0%, #000000 100%);
            color: #0044ff;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 35px;
            text-shadow: 0 0 15px #0044ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(0.98); }
        }

        .video-container {
            margin: 30px auto;
            max-width: 600px;
            border: 3px solid #0044ff;
            border-radius: 15px;
            box-shadow: 0 0 20px #0044ff;
            overflow: hidden;
        }

        .btn-access {
            background-color: transparent;
            color: #0044ff;
            border: 2px solid #0044ff;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50px;
            transition: 0.4s;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn-access:hover {
            background-color: #0044ff;
            color: #000;
            box-shadow: 0 0 30px #0044ff;
        }
    </style>
</head>
<body>

    <h1>نظام التشغيل الآمن</h1>

    <div class="video-container">
        <iframe 
            width="100%" 
            height="315" 
            src="https://www.youtube.com/embed/N1l7T-Am-qc" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <a href="https://drb7w.github.io/Ali.github.io/" class="btn-access">الدخول للمستودع الأول ⚡</a>

    <script>
        var password = "0777F";
        var input = prompt("النظام مغلق.. أدخل رمز التفعيل:");
        if (input != password) {
            alert("تم رصد محاولة اختراق! الدخول مرفوض.");
            document.body.innerHTML = "<h1 style='color:red;'>ACCESS DENIED</h1>";
        }
    </script>

</body>
</html>
