<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALI AIR BASE | مركز العمليات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --gold: #d4af37; --bg: #050505; --green: #00ff00; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; }
        #GATE { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a1a, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .auth-box { background: rgba(255,255,255,0.03); padding: 30px; border: 1px solid var(--gold); border-radius: 5px; text-align: center; width: 85%; max-width: 350px; }
        .unit-id { background: #000; border: 1px solid var(--gold); color: var(--gold); padding: 12px; width: 100%; text-align: center; font-family: 'Orbitron'; font-size: 24px; letter-spacing: 8px; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .btn-deploy { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; font-weight: 900; cursor: pointer; }
        #OPERATIONS_HUB { display: none; padding: 15px; height: 100vh; background: var(--bg); border: 4px solid #111; box-sizing: border-box; flex-direction: column; }
        .top-bar { border-bottom: 1px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .status-tag { border: 1px solid var(--green); color: var(--green); padding: 2px 8px; font-size: 10px; border-radius: 3px; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }
        .radio-unit { flex: 1; display: flex; flex-direction: column; background: #000; border: 1px solid #222; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        .chat-display { flex: 1; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 12px; color: var(--green); }
        .chat-controls { display: flex; border-top: 1px solid #222; padding: 5px; background: #0a0a0a; }
        .chat-input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; outline: none; font-family: 'Cairo'; }
        .btn-send { background: var(--gold); border: none; padding: 0 15px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 8px; border-right: 2px solid var(--gold); padding-right: 8px; }
    </style>
</head>
<body>

    <div id="GATE">
        <div class="auth-box">
            <h3 style="color: var(--gold);">نظام التشفير الجوي</h3>
            <input type="password" id="unit_key" class="unit-id" placeholder="****" maxlength="4">
            <button class="btn-deploy" onclick="verifyAccess()">تأكيد الهوية</button>
        </div>
    </div>

    <div id="OPERATIONS_HUB">
        <div class="top-bar">
            <div><span style="color: var(--gold); font-weight: 900; font-size: 16px;">مقر قيادة الصقور</span></div>
            <div class="status-tag">خط مشفر نشط</div>
        </div>
        <div class="radio-unit">
            <div class="chat-display" id="chat-box"></div>
            <div class="chat-controls">
                <input type="text" id="chat-input" class="chat-input" placeholder="اكتب رسالة للفرقة...">
                <button class="btn-send" onclick="sendBroadcast()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // --- الإعدادات النهائية ---
        const TG_TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0"; 
        const TG_ID = "7772577035"; // تم تحديث الآيدي
        const SECRET_CODE = "1931"; 

        const firebaseConfig = {
          apiKey: "AIzaSyDEawwmho55-yPdFzre4aDleIMB7YMW-Ew",
          authDomain: "ali-air-base-3db5a.firebaseapp.com",
          databaseURL: "https://ali-air-base-3db5a-default-rtdb.firebaseio.com/", // رابط القاعدة الجديد
          projectId: "ali-air-base-3db5a",
          storageBucket: "ali-air-base-3db5a.appspot.com",
          messagingSenderId: "644447806493",
          appId: "1:644447806493:web:d1a8de1a1cbb27a6d912f4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function verifyAccess() {
            if(document.getElementById('unit_key').value === SECRET_CODE) {
                document.getElementById('GATE').style.display = 'none';
                document.getElementById('OPERATIONS_HUB').style.display = 'flex';
                fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=✅ دخول صقر جديد للقاعدة`);
            } else { alert("رمز الدخول خطأ!"); }
        }

        function sendBroadcast() {
            const msg = document.getElementById('chat-input').value;
            if (msg.trim() === "") return;
            db.ref('ops_chat').push().set({ user: "صقر واسط", message: msg, time: new Date().toLocaleTimeString('ar-EG') });
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent("📡 رسالة لاسلكية: " + msg)}`);
            document.getElementById('chat-input').value = "";
        }

        db.ref('ops_chat').limitToLast(20).on('child_added', (snap) => {
            const data = snap.val();
            document.getElementById('chat-box').innerHTML += `<div class="msg"><span style="color:var(--gold)">[${data.user}]</span>: ${data.message}</div>`;
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        });

        document.getElementById('chat-input').addEventListener("keyup", (e) => { if(e.key === "Enter") sendBroadcast(); });
    </script>
</body>
</html>
