<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاختراق الآمن</title>
    <style>
        body { 
            background: #000; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding: 20px;
            overflow: hidden;
        }

        .video-container {
            margin: 20px auto;
            max-width: 600px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
        }

        .btn-hack {
            background: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 0 10px #ff0000;
        }

        /* شاشة الاختراق الوهمية */
        #hacker-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            color: #0f0;
            padding: 20px;
            text-align: left;
            z-index: 9999;
            font-size: 14px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1 id="main-title">نظام التشغيل المشفر 💀</h1>

    <div class="video-container">
        <iframe width="100%" height="250" src="https://www.youtube.com/embed/N1l7T-Am-qc" frameborder="0" allowfullscreen></iframe>
    </div>

    <button class="btn-hack" onclick="startHacking()">تفعيل البروتوكول السري ⚡</button>

    <div id="hacker-screen">
        <div id="hack-text"></div>
    </div>

    <script>
        // نظام كلمة السر
        var password = "0777F";
        var input = prompt("النظام مغلق.. أدخل رمز التفعيل:");
        if (input != password) {
            alert("محاولة دخول غير مصرح بها!");
            document.body.innerHTML = "<h1 style='color:red;'>ACCESS DENIED</h1>";
        }

        // خدعة الاختراق
        function startHacking() {
            document.getElementById('hacker-screen').style.display = 'block';
            let lines = [
                "> INITIALIZING EXPLOIT...",
                "> CONNECTING TO SERVER: 192.168.1.104",
                "> BYPASSING FIREWALL... [DONE]",
                "> DOWNLOADING SYSTEM DATA... 12%",
                "> DOWNLOADING SYSTEM DATA... 45%",
                "> DOWNLOADING SYSTEM DATA... 89%",
                "> CRITICAL ERROR: SECURITY BREACH DETECTED!",
                "> UPLOADING VIRUS TO LOCAL STORAGE...",
                "> ACCESSING PHOTOS & MESSAGES...",
                "> DEVICE OVERHEAT IN 3.. 2.. 1..",
                "> SYSTEM FAILURE! GOODBYE."
            ];
            
            let i = 0;
            let screen = document.getElementById('hack-text');
            
            function addLine() {
                if (i < lines.length) {
                    screen.innerHTML += lines[i] + "<br>";
                    i++;
                    setTimeout(addLine, 400); // سرعة الكتابة
                } else {
                    screen.innerHTML += "<h1 style='color:red; text-align:center;'>DEVICE INFECTED! 💀</h1>";
                }
            }
            addLine();
        }
    </script>

</body>
</html>
