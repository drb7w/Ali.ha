<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALI | Digital Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc; /* لون فسفوري */
            --bg: #050505;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* خلفية متحركة بسيطة */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #050505 25%, #0a0a0a 25%, #0a0a0a 50%, #050505 50%, #050505 75%, #0a0a0a 75%, #0a0a0a 100%);
            background-size: 56.57px 56.57px;
            z-index: -1;
            opacity: 0.5;
        }

        .profile-card {
            margin-top: 50px;
            text-align: center;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            padding: 5px;
            box-shadow: 0 0 20px var(--primary);
            object-fit: cover;
        }

        h1 {
            margin: 15px 0 5px 0;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
        }

        p.bio {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-btn {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.3);
        }

        .skills-section {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skill-badge {
            font-size: 10px;
            padding: 5px 12px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--primary);
            border-radius: 20px;
            color: var(--primary);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 10px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img src="threat.jpg" alt="Ali" class="profile-img">
        
        <h1>ALI</h1>
        <p class="bio">مطور واجهات | صانع محتوى تقني | إمبراطور البرمجة</p>

        <div class="skills-section">
            <span class="skill-badge">HTML/CSS</span>
            <span class="skill-badge">AI Prompting</span>
            <span class="skill-badge">Cybersecurity</span>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 25px 0;">

        <div class="links-container">
            <a href="https://tiktok.com/@your_user" class="link-btn" target="_blank">le_dr313</a>
            <a href="https://instagram.com/your_user" class="link-btn" target="_blank">drb7w</a>
            <a href="https://github.com/drb7w" class="link-btn" target="_blank">مستودع الأكواد (GitHub) 💻</a>
            <a href="mailto:your@email.com" class="link-btn">تواصل معي ✉️</a>
        </div>
    </div>

    <footer>
        DESIGNED BY ALI © 2026 | WASIT, IRAQ
    </footer>

</body>
</html>
