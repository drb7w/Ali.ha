<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL</title>
    <style>
        * { -webkit-user-select: none; user-select: none; }
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; overflow-x: hidden; }
        .video-container { margin: 20px auto; max-width: 400px; border: 2px solid #00ff00; box-shadow: 0 0 20px #00ff00; border-radius: 15px; overflow: hidden; background: #111; }
        .btn-hack { background: transparent; color: #ff0000; border: 2px solid #ff0000; padding: 15px 30px; font-size: 18px; cursor: pointer; margin-top: 25px; font-weight: bold; box-shadow: 0 0 10px #ff0000; border-radius: 5px; }
        #hacker-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; color: #0f0; padding: 30px 20px; text-align: left; z-index: 9999; font-size: 14px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="main-content" style="display:none;">
        <h1>نظام الوصول المشفر 🛡️</h1>
        <div class="video-container">
            <iframe src="https://www.instagram.com/reel/DT5Ht6zjAOY/embed" width="100%" height="480" frameborder="0" scrolling="no"></iframe>
        </div>
        <button class="btn-hack" onclick="startHacking()">تفعيل البروتوكول السري ⚡</button>
    </div>

    <div id="hacker-screen"><div id="hack-text"></div></div>
    <audio id="typeSound" src="https://www.soundjay.com/communication/typewriter-key-1.mp3"></audio>
    <audio id="alarmSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

    <script>
        // ضع معلوماتك هنا بدقة
        const TELEGRAM_TOKEN = "هنا_تحط_التوكن"; 
        const CHAT_ID = "هنا_تحط_الآيدي";
        const SECRET_KEY = "0777F"; 
        let attempts = 0;

        function sendTelegram(msg) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`).catch(e => console.log(e));
        }

        function checkAccess() {
            let userPass = prompt("أدخل رمز الوصول:");
            if (userPass === SECRET_KEY) {
                document.getElementById('main-content').style.display = 'block';
                sendTelegram("✅ دخول ناجح للموقع");
            } else {
                attempts++;
                if (attempts === 2) sendTelegram("⚠️ محاولتين خطأ!");
                if (attempts >= 3) {
                    sendTelegram("🚨 تم قفل الموقع!");
                    alert("SYSTEM LOCKED");
                    document.body.innerHTML = "<h1 style='color:red;'>ACCESS DENIED</h1>";
                } else {
                    alert("رمز خاطئ!");
                    checkAccess();
                }
            }
        }

        window.onload = checkAccess;

        function startHacking() {
            document.getElementById('hacker-screen').style.display = 'block';
            let lines = ["> [!] INITIALIZING...", "> [!] TARGET: WASIT, IRAQ", "> [!] DATA LEAKED 💀"];
            let i = 0;
            let screen = document.getElementById('hack-text');
            function addLine() {
                if (i < lines.length) {
                    screen.innerHTML += lines[i] + "\n";
                    document.getElementById('typeSound').play().catch(e=>{});
                    i++; setTimeout(addLine, 700);
                } else {
                    document.getElementById('alarmSound').play().catch(e=>{});
                }
            }
            addLine();
            sendTelegram("🔥 المستخدم ضغط زر الاختراق!");
        }
    </script>
</body>
</html>

</body>
</html>
