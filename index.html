<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST TERMINAL | v15.0 ELITE</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.25; }
        .center-wrap { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; position: relative; }
        
        #scan-box { width: 200px; height: 200px; border: 2px solid #0f0; border-radius: 20px; overflow: hidden; position: relative; margin-bottom: 20px; display: none; }
        #video-stream { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .scan-bar { position: absolute; width: 100%; height: 3px; background: #0f0; box-shadow: 0 0 15px #0f0; animation: move 2s infinite linear; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }

        .console { width: 95%; max-width: 600px; background: rgba(0,20,0,0.9); border: 1px solid #0f0; padding: 20px; border-radius: 5px; box-shadow: 0 0 40px rgba(0,255,0,0.3); font-size: 13px; }
        .btn-ghost { background: transparent; color: #0f0; border: 1px solid #0f0; padding: 12px 30px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.4s; }
        .btn-ghost:hover { background: #0f0; color: #000; box-shadow: 0 0 30px #0f0; }

        #final-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #900; color: #fff; padding: 40px; z-index: 9999; text-align: center; }
        .loading-bar { width: 100%; height: 5px; background: #222; margin: 10px 0; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: #0f0; transition: 0.1s; }
    </style>
</head>
<body oncontextmenu="return false;">

    <canvas id="matrix"></canvas>

    <div id="auth-screen" class="center-wrap">
        <div class="console" id="terminal-ui" style="display: none;">
            <div id="scan-box"><video id="video-stream" autoplay playsinline muted></video><div class="scan-bar"></div></div>
            <p style="color: #fff;">[ GHOST SYSTEM v15.0 ]</p>
            <p>> Hardware ID: <span id="h-id">...</span></p>
            <p>> Battery Status: <span id="h-bat">...</span></p>
            <p>> Accounts Detected: <span style="color: yellow;">Google, FB, Instagram</span></p>
            <div class="loading-bar"><div id="p-bar" class="progress"></div></div>
            <p id="status-text">> STANDBY FOR HARVESTING...</p>
        </div>
        <button class="btn-ghost" id="main-btn" onclick="startInfection()" style="display: none;">START NEURAL BREACH ⚡</button>
    </div>

    <div id="final-screen">
        <h1 style="font-size: 50px;">SYSTEM INFECTED</h1>
        <p style="font-size: 20px;">ALL FILES HAVE BEEN ENCRYPTED AND SENT TO REMOTE SERVER</p>
        <p id="timer" style="font-size: 80px; margin-top: 50px;">10</p>
        <p>DO NOT CLOSE THIS PAGE OR DATA WILL BE PERMANENTLY LOST</p>
    </div>

    <script>
        const TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0";
        const CHAT_ID = "7772577035";
        const KEY = "0777F";

        function sendMsg(m) { fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(m)}&parse_mode=Markdown`); }
        function speak(t) { window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

        window.onload = async function() {
            let p = prompt("ACCESS KEY REQUIRED:");
            if(p === KEY) {
                document.getElementById('terminal-ui').style.display = "block";
                document.getElementById('main-btn').style.display = "block";
                
                // جلب معلومات حقيقية مرعبة
                let bat = await navigator.getBattery().catch(() => ({level:0.85}));
                document.getElementById('h-bat').innerText = (bat.level * 100).toFixed(0) + "%";
                document.getElementById('h-id').innerText = navigator.platform + "-X" + Math.floor(Math.random()*9000);
                
                // تشغيل الكاميرا (المسح)
                navigator.mediaDevices.getUserMedia({video: true}).then(s => {
                    let v = document.getElementById('video-stream');
                    document.getElementById('scan-box').style.display = "block";
                    v.srcObject = s;
                }).catch(() => {});

                sendMsg("✅ دخول ناجح للمستوى v15.0\nجاري تجهيز الفخ...");
                speak("Access granted. Initializing ghost protocol.");
            } else {
                sendMsg("❌ محاولة دخول فاشلة للمستوى الاحترافي");
                window.location.reload();
            }
        };

        function startInfection() {
            speak("Beginning total device harvest. Do not disconnect.");
            let btn = document.getElementById('main-btn');
            btn.disabled = true;
            btn.innerText = "HARVESTING...";

            let files = ["IMG_2024_01.jpg", "WhatsApp_Database.db", "Private_Vault.zip", "Contact_List.vcf", "History.log"];
            let i = 0;
            let bar = document.getElementById('p-bar');
            let status = document.getElementById('status-text');

            let intv = setInterval(() => {
                if(i <= 100) {
                    bar.style.width = i + "%";
                    if(i % 20 === 0) status.innerText = "> Fetching: " + files[Math.floor(i/25)];
                    i++;
                } else {
                    clearInterval(intv);
                    executeFinal();
                }
            }, 50);
        }

        function executeFinal() {
            sendMsg("🔥 تم سحب البيانات بالكامل! الضحية في حالة رعب حالياً.");
            document.getElementById('final-screen').style.display = "block";
            speak("System collapse. Goodbye.");
            let count = 10;
            let t = setInterval(() => {
                document.getElementById('timer').innerText = count;
                if(count <= 0) {
                    clearInterval(t);
                    alert("WIPE COMPLETE.");
                }
                count--;
            }, 1000);
        }

        // كود المصفوفة
        const c = document.getElementById('matrix');
        const x = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const d = Array(Math.floor(c.width/15)).fill(1);
        function draw() {
            x.fillStyle = "rgba(0,0,0,0.05)"; x.fillRect(0,0,c.width,c.height);
            x.fillStyle = "#0f0"; x.font = "15px arial";
            d.forEach((y, i) => {
                x.fillText(String.fromCharCode(Math.random()*128), i*15, y*15);
                if(y*15 > c.height && Math.random() > 0.975) d[i] = 0;
                d[i]++;
            });
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
